name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-X sysscope/cmd.version=${{ github.ref_name }} -X sysscope/cmd.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o sysscope-windows-amd64.exe .

      - name: Build Linux
        run: GOOS=linux GOARCH=amd64 go build -ldflags "-X sysscope/cmd.version=${{ github.ref_name }} -X sysscope/cmd.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o sysscope-linux-amd64 .

      - name: Build macOS
        run: GOOS=darwin GOARCH=arm64 go build -ldflags "-X sysscope/cmd.version=${{ github.ref_name }} -X sysscope/cmd.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o sysscope-darwin-arm64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            sysscope-windows-amd64.exe
            sysscope-linux-amd64
            sysscope-darwin-arm64

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
